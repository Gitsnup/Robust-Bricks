name: Build Robust Bricks for Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find -L "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RobustBricks-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
